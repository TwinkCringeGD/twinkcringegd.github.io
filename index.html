<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>67 Кликер</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --sekai-bg-dark: #0D0221;
        --bg-gradient: radial-gradient(circle at 50% 45%, #25094d 0%, #120329 55%, #080117 100%);
        --sekai-neon-pink: #FF2EC4;
        --sekai-neon-cyan: #00E5FF;
        --sekai-neon-lime: #B6FF00;
        --sekai-ink-text: #F4F0FF;
        --sekai-card-bg: rgba(22, 9, 44, 0.75);
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background-color: var(--sekai-bg-dark);
        color: var(--sekai-ink-text);
        font-family: 'Montserrat', sans-serif;
        overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
      }
      #game { width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-gradient); }
      .synth-grid { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(255, 46, 196, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.04) 1px, transparent 1px); background-size: 36px 36px; z-index: 1; opacity: 0.7; }
      .ambient-bloom { position: absolute; width: 320px; height: 320px; top: 45%; left: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255, 46, 196, 0.22) 0%, rgba(0, 229, 255, 0.15) 45%, transparent 70%); filter: blur(40px); pointer-events: none; z-index: 2; transition: transform 0.2s ease, opacity 0.2s ease; }
      
      header#hud-top { flex-shrink: 0; position: relative; z-index: 10; padding: 12px 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .top-actions-row { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; }
      .app-title-badge { font-size: 13px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--sekai-neon-cyan); text-shadow: 0 0 10px rgba(0, 229, 255, 0.6); display: flex; align-items: center; gap: 6px; }
      .hud-buttons { display: flex; gap: 8px; }
      .hud-icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(0, 229, 255, 0.35); background: rgba(26, 9, 51, 0.65); color: var(--sekai-ink-text); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; outline: none; transition: transform 0.1s ease, border-color 0.2s ease; }
      .hud-icon-btn:active { transform: scale(0.92); background: rgba(255, 46, 196, 0.25); border-color: var(--sekai-neon-pink); }
      .hud-icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; }
      
      .score-box { display: flex; flex-direction: column; align-items: center; margin-top: 4px; width: 100%; padding: 0 10px; }
      .score-display { font-size: clamp(34px, 8.5vw, 48px); font-weight: 900; letter-spacing: 1px; color: #ffffff; text-shadow: 0 0 8px rgba(255, 46, 196, 0.8), 0 0 20px rgba(0, 229, 255, 0.5); transform-origin: center center; font-variant-numeric: tabular-nums; word-break: break-all; text-align: center; }
      .score-display.pulse { animation: scorePulse 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      @keyframes scorePulse { 0% { transform: scale(1); } 50% { transform: scale(1.14); text-shadow: 0 0 28px #FF2EC4, 0 0 40px #00E5FF; } 100% { transform: scale(1); } }
      .rate-chips { display: flex; gap: 8px; margin-top: 4px; font-size: 13px; font-weight: 700; flex-wrap: wrap; justify-content: center; }
      .rate-chip { padding: 3px 10px; border-radius: 999px; background: rgba(182, 255, 0, 0.12); color: var(--sekai-neon-lime); border: 1px solid rgba(182, 255, 0, 0.3); }
      .rate-chip.click-power { background: rgba(0, 229, 255, 0.12); color: var(--sekai-neon-cyan); border: 1px solid rgba(0, 229, 255, 0.3); }
      
      main#click-stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; z-index: 5; }
      .button-wrapper { position: relative; display: flex; align-items: center; justify-content: center; }
      button#btn-click-67 { width: clamp(200px, 58vw, 260px); height: clamp(200px, 58vw, 260px); border-radius: 50%; border: 4px solid var(--sekai-neon-pink); background: radial-gradient(circle at 35% 30%, #3a0d5c 0%, #1f0438 65%, #100120 100%); color: #FFFFFF; font-family: 'Montserrat', sans-serif; font-size: clamp(68px, 18vw, 88px); font-weight: 900; cursor: pointer; padding: 0; outline: none; touch-action: manipulation; position: relative; z-index: 6; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 25px rgba(255, 46, 196, 0.6), 0 0 50px rgba(0, 229, 255, 0.35), inset 0 0 24px rgba(255, 46, 196, 0.4); transition: transform 0.08s cubic-bezier(0.2, 0, 0.1, 1), box-shadow 0.15s ease, border-color 0.15s ease; }
      button#btn-click-67:active, button#btn-click-67.is-pressed { transform: scale(0.92); border-color: var(--sekai-neon-cyan); box-shadow: 0 0 35px rgba(0, 229, 255, 0.9), 0 0 70px rgba(255, 46, 196, 0.7), inset 0 0 32px rgba(0, 229, 255, 0.6); }
      .btn-67-number { position: relative; z-index: 2; letter-spacing: -2px; text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 25px var(--sekai-neon-pink), 0 0 45px var(--sekai-neon-cyan); }
      .btn-ring-pulse { position: absolute; inset: -12px; border-radius: 50%; border: 2px dashed rgba(0, 229, 255, 0.4); pointer-events: none; animation: spinSlow 20s linear infinite; }
      @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      
      #fx-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
      .floating-text { position: absolute; font-size: 26px; font-weight: 900; color: var(--sekai-neon-lime); text-shadow: 0 0 12px rgba(182, 255, 0, 0.9); pointer-events: none; animation: floatUp 0.75s cubic-bezier(0.165, 0.84, 0.44, 1) forwards; transform: translate(-50%, -50%); white-space: nowrap; }
      @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.85); } 50% { opacity: 1; transform: translate(-50%, -85px) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -120px) scale(0.95); } }
      .spark-particle { position: absolute; border-radius: 50%; pointer-events: none; animation: sparkFly 0.65s cubic-bezier(0.25, 1, 0.5, 1) forwards; transform: translate(-50%, -50%); }
      @keyframes sparkFly { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2); } }
      
      footer#upgrades-panel { flex-shrink: 0; position: relative; z-index: 10; padding: 8px 14px 16px; background: linear-gradient(to top, rgba(10, 2, 25, 0.95) 0%, rgba(13, 2, 33, 0.85) 85%, transparent 100%); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid rgba(255, 46, 196, 0.2); }
      .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 4px; }
      .panel-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(244, 240, 255, 0.8); }
      .cards-grid { display: flex; gap: 10px; width: 100%; max-width: 480px; margin: 0 auto; }
      .upgrade-card { flex: 1 1 0; min-width: 0; background: var(--sekai-card-bg); border: 1px solid rgba(0, 229, 255, 0.28); border-radius: 14px; padding: 10px 10px 10px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
      .upgrade-card.can-afford { border-color: rgba(0, 229, 255, 0.65); box-shadow: 0 0 16px rgba(0, 229, 255, 0.2); }
      .card-info-top { display: flex; align-items: flex-start; gap: 8px; }
      .card-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .card-icon.auto { background: rgba(0, 229, 255, 0.15); color: var(--sekai-neon-cyan); border: 1px solid rgba(0, 229, 255, 0.4); }
      .card-icon.super { background: rgba(255, 46, 196, 0.15); color: var(--sekai-neon-pink); border: 1px solid rgba(255, 46, 196, 0.4); }
      .card-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; }
      .card-text-block { flex: 1 1 0; min-width: 0; }
      .card-name-row { display: flex; align-items: center; justify-content: space-between; }
      .card-name { font-size: clamp(13px, 3.4vw, 15px); font-weight: 800; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .card-level-badge { font-size: 11px; font-weight: 700; color: var(--sekai-neon-cyan); background: rgba(0, 229, 255, 0.15); padding: 1px 6px; border-radius: 6px; }
      .card-effect { font-size: 11px; font-weight: 600; color: var(--sekai-neon-lime); margin-top: 2px; }
      .card-buy-btn { width: 100%; min-height: 44px; border-radius: 10px; border: none; outline: none; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: clamp(12px, 3.2vw, 14px); font-weight: 800; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s ease; }
      .card-buy-btn:disabled { background: #2a243a; color: #7d7593; border: 1px solid #3c3452; cursor: not-allowed; box-shadow: none; }
      .card-buy-btn.active { background: linear-gradient(135deg, var(--sekai-neon-pink) 0%, #a400cc 100%); color: #ffffff; box-shadow: 0 0 14px rgba(255, 46, 196, 0.5); }
      .card-buy-btn.active.auto-color { background: linear-gradient(135deg, var(--sekai-neon-cyan) 0%, #0088cc 100%); box-shadow: 0 0 14px rgba(0, 229, 255, 0.5); }
      
      /* МОДАЛКИ */
      .modal-backdrop { position: absolute; inset: 0; background: rgba(8, 2, 18, 0.85); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 20px 16px; z-index: 45; opacity: 0; visibility: hidden; transition: opacity 0.25s ease, visibility 0.25s ease; }
      .modal-backdrop.open { opacity: 1; visibility: visible; }
      .modal-card { width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto; background: #14052b; border: 2px solid var(--sekai-neon-cyan); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 30px rgba(0, 229, 255, 0.3); }
      .modal-head { display: flex; justify-content: space-between; align-items: center; }
      .modal-title { font-size: 18px; font-weight: 800; color: #ffffff; text-shadow: 0 0 10px var(--sekai-neon-cyan); }
      .modal-close-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.08); color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
      
      .settings-warning { background: rgba(255, 46, 46, 0.15); border: 1px solid rgba(255, 46, 46, 0.5); color: #ff4a4a; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: 800; text-align: center; line-height: 1.3; margin-bottom: 8px; }
      .settings-row { display: flex; flex-direction: column; gap: 6px; }
      .settings-label { font-size: 12px; font-weight: 700; color: rgba(255, 255, 255, 0.8); }
      .settings-input { width: 100%; min-height: 40px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 8px; padding: 8px 12px; font-size: 16px; color: #ffffff; font-family: inherit; outline: none; }
      
      /* ИСПРАВЛЕННЫЙ БЛОК РЕКОРДОВ */
      .share-preview-card { background: linear-gradient(135deg, #24094a 0%, #100224 100%); border: 1.5px solid var(--sekai-neon-pink); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; overflow: hidden; width: 100%; }
      .share-card-score { font-size: clamp(16px, 5vw, 24px); font-weight: 900; color: #ffffff; text-shadow: 0 0 16px var(--sekai-neon-pink); word-break: break-all; line-height: 1.1; }
      .leaderboard-list { width: 100%; }
      .leaderboard-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; gap: 8px; font-size: 13px; }
      .leaderboard-item span:last-child { font-weight: 800; word-break: break-all; text-align: right; }
      
      .modal-btn { width: 100%; min-height: 44px; border-radius: 12px; border: none; color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
      .modal-btn.apply { background: linear-gradient(135deg, var(--sekai-neon-cyan) 0%, #0077aa 100%); box-shadow: 0 0 16px rgba(0, 229, 255, 0.6); }
      .modal-btn.reset { background: linear-gradient(135deg, #ff2e2e 0%, #a40000 100%); box-shadow: 0 0 16px rgba(255, 46, 46, 0.6); }
    </style>
</head>
<body>
    <div id="game">
      <div class="synth-grid"></div>
      <div class="ambient-bloom" id="ambient-bloom"></div>
      <div id="fx-container"></div>

      <header id="hud-top">
        <div class="top-actions-row">
          <div class="app-title-badge">67 Кликер</div>
          <div class="hud-buttons">
            <button id="btn-records" class="hud-icon-btn" aria-label="Рекорды">
              <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.45 1-1 1H8c-.55 0-1 .45-1 1v1h10v-1c0-.55-.45-1-1-1h-1c-.55 0-1-.45-1-1v-2.34M6 4h12v5a6 6 0 0 1-12 0V4z" stroke-width="2"></path></svg>
            </button>
            <button id="btn-settings" class="hud-icon-btn" aria-label="Настройки">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke-width="2"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke-width="2"></path></svg>
            </button>
          </div>
        </div>

        <div class="score-box">
          <div id="score-display" class="score-display pulse">67: 0</div>
          <div class="rate-chips">
            <div id="rate-display" class="rate-chip">+0 / сек</div>
            <div id="click-rate-display" class="rate-chip click-power">+1 за клик</div>
          </div>
        </div>
      </header>

      <main id="click-stage">
        <div class="button-wrapper">
          <div class="btn-ring-pulse"></div>
          <button id="btn-click-67"><span class="btn-67-number">67</span></button>
        </div>
      </main>

      <footer id="upgrades-panel">
        <div class="panel-header"><span class="panel-title">Улучшения</span></div>
        <div class="cards-grid">
          <div class="upgrade-card can-afford" id="card-autoclick">
            <div class="card-info-top">
              <div class="card-icon auto"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10" stroke-width="2.5"></polyline><polyline points="1 20 1 14 7 14" stroke-width="2.5"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" stroke-width="2.5"></path></svg></div>
              <div class="card-text-block">
                <div class="card-name-row"><span class="card-name">Автоклик</span><span class="card-level-badge" id="lvl-autoclick">0</span></div>
                <div class="card-effect">+1 / сек</div>
              </div>
            </div>
            <button id="btn-buy-autoclick" class="card-buy-btn active auto-color"><span>Купить</span><span id="cost-autoclick">50</span></button>
          </div>
          <div class="upgrade-card can-afford" id="card-superclick">
            <div class="card-info-top">
              <div class="card-icon super"><svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" stroke-width="2.5"></polygon></svg></div>
              <div class="card-text-block">
                <div class="card-name-row"><span class="card-name">Супер-клик</span><span class="card-level-badge" id="lvl-superclick">0</span></div>
                <div class="card-effect">+5 за клик</div>
              </div>
            </div>
            <button id="btn-buy-superclick" class="card-buy-btn active"><span>Купить</span><span id="cost-superclick">150</span></button>
          </div>
        </div>
      </footer>

      <!-- МОДАЛКА РЕКОРДОВ -->
      <div id="modal-records" class="modal-backdrop">
        <div class="modal-card">
          <div class="modal-head"><span class="modal-title">Рекорды</span><button id="btn-close-modal" class="modal-close-btn">✖</button></div>
          <div class="share-preview-card">
            <div class="share-card-badge">67 КЛИКЕР</div>
            <div id="share-score-val" class="share-card-score">67: 0</div>
          </div>
          <div class="leaderboard-list">
            <div class="leaderboard-item">
              <span>Твой лучший результат</span><span id="modal-best-score">0</span>
            </div>
          </div>
        </div>
      </div>

      <!-- МОДАЛКА НАСТРОЕК -->
      <div id="modal-settings" class="modal-backdrop">
        <div class="modal-card">
          <div class="modal-head"><span class="modal-title">Настройки</span><button id="btn-close-settings" class="modal-close-btn">✖</button></div>
          
          <div class="settings-warning">⚠ РЕКОРД НЕ СЧИТАЕТСЯ, ЕСЛИ ВЫ ЧТО-ТО ИЗМЕНИТЕ.</div>

          <div class="settings-row">
            <label class="settings-label">Очки 67:</label>
            <input type="number" id="setting-score" class="settings-input" min="0">
          </div>
          <div class="settings-row">
            <label class="settings-label">Сила клика:</label>
            <input type="number" id="setting-click-power" class="settings-input" min="1">
          </div>
          <div class="settings-row">
            <label class="settings-label">Доход в секунду:</label>
            <input type="number" id="setting-passive-rate" class="settings-input" min="0">
          </div>
          
          <button id="btn-save-settings" class="modal-btn apply">Применить параметры</button>
          <button id="btn-reset-game" class="modal-btn reset">СБРОСИТЬ ПРОГРЕСС</button>
        </div>
      </div>
    </div>

    <script>
      const state = { score: 0, clickPower: 1, passiveRate: 0, autoClicks: 0, superClicks: 0, bestScore: 0 };
      
      const elScore = document.getElementById('score-display');
      const elRate = document.getElementById('rate-display');
      const elClickRate = document.getElementById('click-rate-display');
      const elBtnClick = document.getElementById('btn-click-67');
      const elBtnAuto = document.getElementById('btn-buy-autoclick');
      const elBtnSuper = document.getElementById('btn-buy-superclick');
      const elCostAuto = document.getElementById('cost-autoclick');
      const elCostSuper = document.getElementById('cost-superclick');
      const elLvlAuto = document.getElementById('lvl-autoclick');
      const elLvlSuper = document.getElementById('lvl-superclick');
      const elCardAuto = document.getElementById('card-autoclick');
      const elCardSuper = document.getElementById('card-superclick');
      const elFxContainer = document.getElementById('fx-container');
      const elBloom = document.getElementById('ambient-bloom');

      const elModalRecords = document.getElementById('modal-records');
      const elModalSettings = document.getElementById('modal-settings');
      const elShareScoreVal = document.getElementById('share-score-val');
      const elModalBestScore = document.getElementById('modal-best-score');
      const elSettingScore = document.getElementById('setting-score');
      const elSettingClickPower = document.getElementById('setting-click-power');
      const elSettingPassiveRate = document.getElementById('setting-passive-rate');

      // Форматирование с пробелами
      function formatScore(n) { return Math.floor(n).toLocaleString('ru-RU'); }
      function getAutoclickCost() { return Math.floor(50 * Math.pow(1.18, state.autoClicks)); }
      function getSuperclickCost() { return Math.floor(150 * Math.pow(1.22, state.superClicks)); }

      // === АВТОСОХРАНЕНИЕ ===
      function saveGame() {
        localStorage.setItem('67_save', JSON.stringify(state));
      }

      // Каждые 3 секунды сохраняем игру на всякий случай
      setInterval(saveGame, 3000);

      // При закрытии вкладки тоже сохраняем
      window.addEventListener('beforeunload', saveGame);

      function updateUI() {
        elScore.textContent = `67: ${formatScore(state.score)}`;
        elRate.textContent = `+${formatScore(state.passiveRate)} / сек`;
        elClickRate.textContent = `+${formatScore(state.clickPower)} за клик`;
        
        const costAuto = getAutoclickCost();
        const costSuper = getSuperclickCost();
        elCostAuto.textContent = formatScore(costAuto);
        elCostSuper.textContent = formatScore(costSuper);
        elLvlAuto.textContent = state.autoClicks;
        elLvlSuper.textContent = state.superClicks;
        
        elBtnAuto.disabled = state.score < costAuto;
        elBtnAuto.className = state.score >= costAuto ? 'card-buy-btn active auto-color' : 'card-buy-btn disabled';
        elBtnSuper.disabled = state.score < costSuper;
        elBtnSuper.className = state.score >= costSuper ? 'card-buy-btn active' : 'card-buy-btn disabled';
        
        elShareScoreVal.textContent = `67: ${formatScore(state.score)}`;
        elModalBestScore.textContent = formatScore(Math.max(state.score, state.bestScore));
      }

      function pulseScore() { elScore.classList.remove('pulse'); void elScore.offsetWidth; elScore.classList.add('pulse'); }

      const SPARK_COLORS = ['#FF2EC4', '#00E5FF', '#B6FF00', '#FFFFFF'];
      function spawnClickFX(x, y) {
        const floatEl = document.createElement('div');
        floatEl.className = 'floating-text'; floatEl.textContent = `+${formatScore(state.clickPower)}`;
        floatEl.style.left = `${x}px`; floatEl.style.top = `${y}px`;
        elFxContainer.appendChild(floatEl);
        setTimeout(() => floatEl.remove(), 760);

        for (let i = 0; i < 8; i++) {
          const spark = document.createElement('div');
          spark.className = 'spark-particle';
          const size = Math.floor(Math.random() * 6 + 4);
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * 65 + 35;
          spark.style.width = `${size}px`; spark.style.height = `${size}px`;
          spark.style.backgroundColor = SPARK_COLORS[Math.floor(Math.random() * SPARK_COLORS.length)];
          spark.style.left = `${x}px`; spark.style.top = `${y}px`;
          spark.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
          spark.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
          elFxContainer.appendChild(spark);
          setTimeout(() => spark.remove(), 660);
        }
        elBloom.style.opacity = '1'; elBloom.style.transform = 'translate(-50%, -50%) scale(1.15)';
        setTimeout(() => { elBloom.style.opacity = '0.7'; elBloom.style.transform = 'translate(-50%, -50%) scale(1)'; }, 140);
      }

      function handleClick(e) {
        state.score += state.clickPower;
        if (state.score > state.bestScore) state.bestScore = state.score;
        pulseScore();
        let tapX = e.clientX || (elBtnClick.getBoundingClientRect().left + elBtnClick.getBoundingClientRect().width / 2);
        let tapY = e.clientY || (elBtnClick.getBoundingClientRect().top + elBtnClick.getBoundingClientRect().height / 2);
        spawnClickFX(tapX, tapY);
        updateUI();
        saveGame();
      }

      function buyUpgrade(type) {
        if (type === 'auto') {
          const cost = getAutoclickCost();
          if (state.score >= cost) { state.score -= cost; state.autoClicks++; state.passiveRate += 1; updateUI(); saveGame(); }
        } else {
          const cost = getSuperclickCost();
          if (state.score >= cost) { state.score -= cost; state.superClicks++; state.clickPower += 5; updateUI(); saveGame(); }
        }
      }

      // Кнопки
      elBtnClick.addEventListener('pointerdown', (e) => { e.preventDefault(); elBtnClick.classList.add('is-pressed'); handleClick(e); });
      elBtnClick.addEventListener('pointerup', () => elBtnClick.classList.remove('is-pressed'));
      elBtnClick.addEventListener('pointerleave', () => elBtnClick.classList.remove('is-pressed'));
      elBtnAuto.addEventListener('click', () => buyUpgrade('auto'));
      elBtnSuper.addEventListener('click', () => buyUpgrade('super'));

      // Модалки
      document.getElementById('btn-records').addEventListener('click', () => { updateUI(); elModalRecords.classList.add('open'); });
      document.getElementById('btn-close-modal').addEventListener('click', () => elModalRecords.classList.remove('open'));
      
      document.getElementById('btn-settings').addEventListener('click', () => { 
        elSettingScore.value = state.score; elSettingClickPower.value = state.clickPower; elSettingPassiveRate.value = state.passiveRate;
        elModalSettings.classList.add('open'); 
      });
      document.getElementById('btn-close-settings').addEventListener('click', () => elModalSettings.classList.remove('open'));
      
      // Применить настройки
      document.getElementById('btn-save-settings').addEventListener('click', () => {
        state.score = Math.max(0, parseInt(elSettingScore.value) || 0);
        state.clickPower = Math.max(1, parseInt(elSettingClickPower.value) || 1);
        state.passiveRate = Math.max(0, parseInt(elSettingPassiveRate.value) || 0);
        updateUI(); saveGame();
        elModalSettings.classList.remove('open');
      });

      // РЕСЕТ
      document.getElementById('btn-reset-game').addEventListener('click', () => {
        if(confirm("Вы уверены? Весь прогресс будет удален!")) {
          state.score = 0; state.clickPower = 1; state.passiveRate = 0; state.autoClicks = 0; state.superClicks = 0; state.bestScore = 0;
          updateUI(); saveGame();
          elModalSettings.classList.remove('open');
        }
      });

      // Пассивный доход
      setInterval(() => { if (state.passiveRate > 0) { state.score += state.passiveRate; if (state.score > state.bestScore) state.bestScore = state.score; updateUI(); } }, 1000);

      // Загрузка при старте
      const saved = localStorage.getItem('67_save');
      if (saved) { try { Object.assign(state, JSON.parse(saved)); } catch(_) {} }
      updateUI();
    </script>
</body>
</html>
